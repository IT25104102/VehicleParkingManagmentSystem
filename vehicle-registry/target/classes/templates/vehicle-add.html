<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkCity - Add Vehicle</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" th:href="@{/vehicles}">
        <span class="brand-plus">+</span>
        <span class="brand-text">ParkCity</span>
    </a>
    <ul class="nav-links">
        <li><a href="#">HOME</a></li>
        <li><a href="#">PARKING SLOTS</a></li>
        <li><a th:href="@{/vehicles}" class="active">MY VEHICLES</a></li>
        <li><a href="#">TICKETS</a></li>
        <li><a href="#">PAYMENTS</a></li>
    </ul>
    <div style="display:flex; gap:0.75rem;">
        <a th:href="@{/vehicles}" class="btn btn-outline-white">← Back</a>
        <a th:href="@{/vehicles/add}" class="btn btn-primary">+ Add Vehicle</a>
    </div>
</nav>

<div class="page-container">

    <div class="page-header">
        <h1 class="page-title">Register <span>New Vehicle</span></h1>
        <p class="page-subtitle">Add a new vehicle to the ParkCity parking registry</p>
    </div>

    <div class="card">
        <form th:action="@{/vehicles/add}" th:object="${vehicle}" method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="plateNumber">Plate Number *</label>
                    <input type="text" id="plateNumber" th:field="*{plateNumber}"
                           placeholder="e.g. CAR-1234" required style="text-transform:uppercase;">
                </div>

                <div class="form-group">
                    <label for="ownerId">Owner ID *</label>
                    <input type="text" id="ownerId" th:field="*{ownerId}"
                           placeholder="e.g. IT25100132" required>
                </div>

                <div class="form-group full-width">
                    <label for="ownerName">Owner Full Name *</label>
                    <input type="text" id="ownerName" th:field="*{ownerName}"
                           placeholder="e.g. Gayana De Silva" required>
                </div>

                <div class="form-group">
                    <label for="type">Vehicle Type *</label>
                    <select id="type" th:field="*{type}" required>
                        <option value="">-- Select Type --</option>
                        <option value="Car">Car</option>
                        <option value="Motorcycle">Motorcycle</option>
                        <option value="Van">Van</option>
                        <option value="Truck">Truck</option>
                        <option value="Bus">Bus</option>
                        <option value="Three Wheeler">Three Wheeler</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="model">Vehicle Model *</label>
                    <input type="text" id="model" th:field="*{model}"
                           placeholder="e.g. Toyota Corolla" required>
                </div>

                <div class="form-group full-width">
                    <label for="contact">Owner Contact *</label>
                    <input type="text" id="contact" th:field="*{contact}"
                           placeholder="e.g. 0771234567" required>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ Register Vehicle</button>
                <a th:href="@{/vehicles}" class="btn btn-outline">Cancel</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
